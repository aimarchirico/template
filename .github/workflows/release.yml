name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  deployments: write

jobs:
  # ==========================================
  # RELEASE PLEASE
  # ==========================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      backend--version: ${{ steps.release.outputs.backend--version }}
      frontend--version: ${{ steps.release.outputs.frontend--version }}
      frontend--upload_url: ${{ steps.release.outputs.frontend--upload_url }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: tools/release-please-config.json
          manifest-file: tools/.release-please-manifest.json

  # ==========================================
  # API IMAGE
  # ==========================================
  api-release:
    name: API Release
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/docker-release@main
        with:
          image: ghcr.io/${{ github.repository }}-api
          context: ./backend
          version: ${{ needs.release-please.outputs.backend--version }}
          gh_packages_token: ${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # ANDROID APK
  # ==========================================
  android-release:
    name: Android Release
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    environment: android-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/android-release@main
        with:
          version: ${{ needs.release-please.outputs.frontend--version }}
          upload_url: ${{ needs.release-please.outputs.frontend--upload_url }}
          android_key_alias: ${{ vars.ANDROID_KEY_ALIAS }}
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android_keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
  # ==========================================
  # TRIGGER API DEPLOYMENT
  # ==========================================
  deploy-api:
    name: Deploy API
    needs: api-release
    environment: api-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/vps-deploy@main
        with:
          api_url: ${{ vars.API_URL }}
          vps_host: ${{ vars.VPS_HOST }}
          vps_user: ${{ vars.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}

  # ==========================================
  # TRIGGER WEB DEPLOYMENT
  # ==========================================
  deploy-web:
    name: Deploy Web
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    environment: web-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/cloudflare-deploy@main
        with:
          app_url: ${{ vars.APP_URL }}
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          build_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}