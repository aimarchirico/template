name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  deployments: write

jobs:
  # ==========================================
  # RELEASE (release-please + API image + APK)
  # ==========================================
  release:
    name: Release
    uses: aimarchirico/commons/.github/workflows/reusable-release.yml@main
    secrets: inherit

  # ==========================================
  # TRIGGER API DEPLOYMENT
  # ==========================================
  deploy-api:
    name: Deploy API
    needs: release
    if: contains(fromJSON(needs.release.outputs.paths_released), 'backend')
    uses: ./.github/workflows/deploy.yml
    with:
      deploy-api: true
    secrets: inherit

  # ==========================================
  # TRIGGER WEB DEPLOYMENT
  # ==========================================
  deploy-web:
    name: Deploy Web
    needs: release
    if: contains(fromJSON(needs.release.outputs.paths_released), 'frontend')
    uses: ./.github/workflows/deploy.yml
    with:
      deploy-web: true
    secrets: inherit
