name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  deployments: write

jobs:
  # ==========================================
  # RELEASE PLEASE
  # ==========================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      backend--version: ${{ steps.release.outputs.backend--version }}
      frontend--version: ${{ steps.release.outputs.frontend--version }}
      frontend--upload_url: ${{ steps.release.outputs.frontend--upload_url }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: tools/release-please-config.json
          manifest-file: tools/.release-please-manifest.json

  # ==========================================
  # API IMAGE
  # ==========================================
  api-release:
    name: API Release
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'backend')
    uses: aimarchirico/commons/.github/workflows/docker-release.yml@main
    with:
      image: ghcr.io/${{ github.repository }}-api
      context: ./backend
      version: ${{ needs.release-please.outputs.backend--version }}
    secrets: inherit

  # ==========================================
  # ANDROID APK
  # ==========================================
  android-release:
    name: Android Release
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    uses: aimarchirico/commons/.github/workflows/android-release.yml@main
    with:
      version: ${{ needs.release-please.outputs.frontend--version }}
      upload_url: ${{ needs.release-please.outputs.frontend--upload_url }}
      build_env: |
        NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
        API_URL=${{ vars.API_URL }}
        CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    secrets: inherit

  # ==========================================
  # TRIGGER API DEPLOYMENT
  # ==========================================
  deploy-api:
    name: Deploy API
    needs: api-release
    uses: aimarchirico/commons/.github/workflows/vps-deploy.yml@main
    secrets: inherit

  # ==========================================
  # TRIGGER WEB DEPLOYMENT
  # ==========================================
  deploy-web:
    name: Deploy Web
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    uses: aimarchirico/commons/.github/workflows/cloudflare-deploy.yml@main
    with:
      build_env: |
        NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
        API_URL=${{ vars.API_URL }}
        CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    secrets: inherit
