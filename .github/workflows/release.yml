name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  deployments: write

jobs:
  # ==========================================
  # RELEASE PLEASE
  # ==========================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      backend--version: ${{ steps.release.outputs.backend--version }}
      frontend--version: ${{ steps.release.outputs.frontend--version }}
      frontend--upload_url: ${{ steps.release.outputs.frontend--upload_url }}
      frontend--html_url: ${{ steps.release.outputs.frontend--html_url }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: tools/release-please-config.json
          manifest-file: tools/.release-please-manifest.json

  # ==========================================
  # API IMAGE
  # ==========================================
  release-api:
    name: Release API
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/docker-release@main
        with:
          image: ghcr.io/${{ github.repository }}-api
          context: backend
          version: ${{ needs.release-please.outputs.backend--version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_secrets: |
            maven_password=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # ANDROID APK
  # ==========================================
  release-android:
    name: Release Android
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    environment:
      name: android-production
      url: ${{ needs.release-please.outputs.frontend--html_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/android-release@main
        with:
          command: frontend:build:android
          node_cache_path: frontend/pnpm-lock.yaml
          output_directory: frontend/apps/expo
          version: ${{ needs.release-please.outputs.frontend--version }}
          upload_url: ${{ needs.release-please.outputs.frontend--upload_url }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          android_key_alias: ${{ vars.ANDROID_KEY_ALIAS }}
          android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android_keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          build_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            
  # ==========================================
  # API DEPLOYMENT
  # ==========================================
  deploy-api:
    name: Deploy API
    needs: release-api
    environment:
      name: api-production
      url: ${{ vars.API_URL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/vps-deploy@main
        with:
          vps_host: ${{ vars.VPS_HOST }}
          vps_user: ${{ vars.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}

  # ==========================================
  # WEB DEPLOYMENT
  # ==========================================
  deploy-web:
    name: Deploy Web
    needs: release-please
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'frontend')
    environment:
      name: web-production
      url: ${{ vars.APP_URL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/cloudflare-deploy@main
        with:
          command: frontend:build:web
          node_cache_path: frontend/pnpm-lock.yaml
          output_directory: frontend/apps/expo/dist
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          build_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}