name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ==========================================
  # PATH FILTERING
  # ==========================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  # ==========================================
  # BACKEND CI JOB
  # ==========================================
  backend-ci:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/java-ci@main
        with:
          command: backend:check
          task_env: |
            MAVEN_USERNAME=${{ github.actor }}
            MAVEN_PASSWORD=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # FRONTEND CI JOB
  # ==========================================
  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/node-ci@main
        with:
          command: frontend:check
          node_cache_path: ./frontend/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  # ==========================================
  # DOCUMENTATION CI JOB
  # ==========================================
  docs:
    name: Docs Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aimarchirico/commons/.github/actions/node-ci@main
        with:
          command: docs:check
          node_cache_path: tools/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # COMMIT CI JOB
  # ==========================================
  commitlint:
    name: Commit Check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aimarchirico/commons/.github/actions/node-ci@main
        with:
          command: commit:check
          node_cache_path: tools/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            FROM_SHA=${{ github.event.pull_request.base.sha }}
            TO_SHA=${{ github.event.pull_request.head.sha }}
