name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  api-ci:
    name: Api CI
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set Up Gradle/Java
        uses: aimarchirico/core/.github/actions/setup-java@dev

      - name: Run Check
        run: task api:check

  client-ci:
    name: Client CI
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_NPM_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: aimarchirico/core/.github/actions/setup-node@dev
        with:
          cache-dependency-path: ./client/pnpm-lock.yaml

      - name: Run Check
        run: task client:check
        env:
          API_URL: ${{ vars.API_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Commit Check
    runs-on: ubuntu-latest
    env:
      GITHUB_NPM_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: aimarchirico/core/.github/actions/setup-node@dev
        with:
          cache-dependency-path: ./tools/pnpm-lock.yaml

      - name: Run Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter template-tools exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
          else
            task tools:lint:commit
          fi

  docs-ci:
    name: Docs CI
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_NPM_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: aimarchirico/core/.github/actions/setup-node@dev
        with:
          cache-dependency-path: ./tools/pnpm-lock.yaml

      - name: Run Docs Checks
        run: task tools:check
