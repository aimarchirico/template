name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ==========================================
  # PATH FILTERING
  # ==========================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      github: ${{ steps.filter.outputs.github }}
      tools: ${{ steps.filter.outputs.config }}
      setup: ${{ steps.filter.outputs.setup }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Detect Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            config:
              - '**/*.ts'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.toml'
              - '!frontend/apps/**'
              - '!frontend/packages/**'
              - '!setup/**'
            setup:
              - 'setup/**'
              - '.github/workflows/ci.yaml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yaml'
            github:
              - '.github/**'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'

  # ==========================================
  # COMMIT CI JOB
  # ==========================================
  commitlint:
    name: Commit Check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aimarchirico/commons/.github/actions/node-task@main
        with:
          command: commit:check
          node_cache_path: tools/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            FROM_SHA=${{ github.event.pull_request.base.sha }}
            TO_SHA=${{ github.event.pull_request.head.sha }}

  # ==========================================
  # CONFIG CI JOB
  # ==========================================
  config:
    name: Config Check
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/node-task@main
        with:
          command: config:check
          node_cache_path: tools/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # DOCS CI JOB
  # ==========================================
  docs:
    name: Docs Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/node-task@main
        with:
          command: docs:check
          node_cache_path: tools/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # GITHUB CI JOB
  # ==========================================
  github:
    name: GitHub Check
    needs: changes
    if: needs.changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/github-task@main
        with:
          command: github:check

  # ==========================================
  # BACKEND CI JOB
  # ==========================================
  backend-ci:
    name: Backend Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/java-task@main
        with:
          command: backend:check
          task_env: |
            MAVEN_USERNAME=${{ github.actor }}
            MAVEN_PASSWORD=${{ secrets.GH_PACKAGES_TOKEN }}

  # ==========================================
  # FRONTEND CI JOB
  # ==========================================
  frontend-ci:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/node-task@main
        with:
          command: frontend:check
          node_cache_path: frontend/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
            API_URL=${{ vars.API_URL }}
            CF_ACCESS_CLIENT_ID=${{ vars.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  # ==========================================
  # SETUP CI JOB
  # ==========================================
  setup-ci:
    name: Setup Check
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aimarchirico/commons/.github/actions/node-task@main
        with:
          command: setup:check
          node_cache_path: setup/pnpm-lock.yaml
          task_env: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
