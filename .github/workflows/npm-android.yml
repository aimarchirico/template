name: Npm - Android

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: write

jobs:
  deploy:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    env:
      GITHUB_NPM_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: ./.github/actions/setup-node
        with:
          node-version: 20.x
          cache-dependency-path: ./npm/pnpm-lock.yaml

      - name: Set Up Java
        uses: ./.github/actions/setup-java
        with:
          java-version: '17'

      - name: Set Up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Get Version from Tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/npm-v}"
          if [ "$VERSION" = "$GITHUB_REF" ]; then VERSION="dev"; fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

      - name: Run CI Build
        run: task ci:android
        working-directory: ./npm
        env:
          API_URL: ${{ vars.API_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases

      - name: Copy APK
        run: cp ./npm/apps/expo/android/app/build/outputs/apk/release/app-release.apk ${{ github.workspace }}/app-release.apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ steps.get_version.outputs.VERSION_NAME}}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/app-release.apk
          asset_name: template-${{ steps.get_version.outputs.VERSION_NAME}}.apk
          asset_content_type: application/vnd.android.package-archive
