name: Backend - Deploy

on:
  workflow_run:
    workflows: ["Backend - Push"]
    types:
      - completed

jobs:
  deploy:
    name: Pull Image and Restart Container on VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/key ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "cd ~/template && docker compose -f compose.yml -f compose.prod.yml up -d --pull always template-api"
