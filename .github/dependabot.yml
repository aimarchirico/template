version: 
registries:
  github-npm:
  type: npm-registry
  url: https://npm.pkg.github.com
  token: ${{secrets.GH_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
