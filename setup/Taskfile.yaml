version: '3'

# setup/.env is loaded by the root Taskfile: Task rejects dotenv declarations in
# included Taskfiles.

# The commands report their own outcomes, so echoing each shell block would bury
# the summary this flow exists to produce.
silent: true

vars:
  OUTPUTS: '{{.TASKFILE_DIR}}/.outputs.env'
  ENVIRONMENTS: 'api-production,android-production,web-production'

tasks:
  install:
    internal: true
    desc: Install the module's dependencies
    cmds:
      - pnpm install

  check:
    desc: Check TypeScript files
    cmds:
      - task: install
      - pnpm check

  fix:
    desc: Fix TypeScript files
    cmds:
      - pnpm fix

  init:
    desc: Rename the project from the template values, then provision it
    cmds:
      - task: install
      - pnpm exec tsx scripts/init-project.ts
      - task: default

  default:
    desc: Provision every external resource the project needs
    cmds:
      - task: prerequisites
      - task: github:project
      - task: github:environments
      - task: cloudflare:pages
      - task: cloudflare:tunnel
      - task: cloudflare:token
      - task: android:keystore
      - task: backend:env
      - task: cloudflare:pages-env
      - task: github:variables
      - task: github:secrets
      - task: summary

  prerequisites:
    desc: Verify the required tools and credentials are present
    cmds:
      - task: install
      - pnpm exec tsx scripts/check-prerequisites.ts

  github:project:
    desc: Copy the template's project board and link it
    cmds:
      - pnpm exec tsx scripts/github-project.ts

  github:environments:
    desc: Create the deployment environments
    cmds:
      - pnpm exec tsx scripts/github-environments.ts

  cloudflare:pages:
    desc: Create the Pages project and attach its custom domain
    cmds:
      - pnpm exec tsx scripts/cloudflare-pages.ts

  cloudflare:tunnel:
    desc: Route the project's API hostname through the shared tunnel
    cmds:
      - pnpm exec tsx scripts/cloudflare-tunnel.ts

  cloudflare:token:
    desc: Create the Access service token CI uses to reach the API
    cmds:
      - pnpm exec tsx scripts/cloudflare-token.ts

  android:keystore:
    desc: Ensure the Android signing keystore exists and read back its values
    # The keystore is stored in EAS and read back from there, so no signing key
    # is ever written into the repository or left on this machine.
    cmds:
      - pnpm exec tsx scripts/android-keystore.ts

  backend:env:
    desc: Place the backend's production env and compose files on the VPS
    cmds:
      - pnpm exec tsx scripts/backend-env.ts

  cloudflare:pages-env:
    desc: Set the Pages runtime environment
    cmds:
      - pnpm exec tsx scripts/cloudflare-pages-env.ts

  github:variables:
    desc: Push the repository and environment variables
    cmds:
      - pnpm exec tsx scripts/github-variables.ts

  github:secrets:
    desc: Push the repository and environment secrets
    cmds:
      - pnpm exec tsx scripts/github-secrets.ts

  summary:
    desc: Print every provisioned resource and the values that were set
    # Task-local, not global: as global vars these would run on every `task`
    # invocation anywhere in the repository, before the module is installed.
    vars:
      NAME:
        sh: pnpm exec tsx scripts/lib/config-value.ts name
      SLUG:
        sh: pnpm exec tsx scripts/lib/config-value.ts slug
      BACKEND_PORT:
        sh: pnpm exec tsx scripts/lib/config-value.ts modules.backend.port
    cmds:
      - |
        SLUG='{{.SLUG}}'
        REPO="$(gh repo view --json name -q .name)"
        echo
        echo "Provisioned $(gh repo view --json nameWithOwner -q .nameWithOwner)"
        echo "  project board    {{.NAME}}"
        echo "  environments     {{.ENVIRONMENTS}}"
        echo "  app url          https://$SLUG.$BASE_DOMAIN"
        echo "  api url          https://$API_HOST/$SLUG"
        echo "  tunnel route     $API_HOST -> http://localhost:{{.BACKEND_PORT}}"
        echo "  backend env      $VPS_USER@$VPS_HOST:~/docker/$REPO/.env"
        echo "  keystore         EAS, build credentials \"production\""
        echo
        if [ -f '{{.OUTPUTS}}' ]; then
          echo 'Values produced during this run and chained onward:'
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            case "$key" in
              *SECRET*|*PASSWORD*|*TOKEN*|*BASE64*)
                echo "  $key=<${#value} characters>" ;;
              *) echo "  $key=$value" ;;
            esac
          done < '{{.OUTPUTS}}'
          echo
          echo 'Back these up now — see setup/README.md#backup-and-recovery.'
        fi
