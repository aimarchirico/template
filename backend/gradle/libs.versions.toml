[versions]
kotlin = "2.1.0"
spring-boot = "3.5.3"
spring-dependency-management = "1.1.7"
hypersistence = "3.7.3"
opencsv = "5.9"
springdoc = "2.5.0"
firebase-admin = "9.2.0"
ktfmt = "0.22.0"
archunit = "1.3.0"
spring-ai = "1.1.2"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradlePlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

hypersistence-utils = { module = "io.hypersistence:hypersistence-utils-hibernate-63", version.ref = "hypersistence" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
ktfmt-gradlePlugin = { module = "com.ncorti.ktfmt.gradle:com.ncorti.ktfmt.gradle.gradle.plugin", version.ref = "ktfmt" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
spring-ai-google-genai = { module = "org.springframework.ai:spring-ai-starter-model-google-genai", version.ref = "spring-ai" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
template-kotlin = { id = "template.kotlin", version = "unspecified" }
template-spring = { id = "template.spring", version = "unspecified" }
