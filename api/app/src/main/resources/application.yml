spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: template

  datasource:
    url: jdbc:postgresql://${DB_HOST}/template
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  jackson:
    deserialization:
      fail-on-unknown-properties: false
      accept-empty-string-as-null-object: true

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  version: ${VERSION_NAME:unknown}

server:
  servlet:
    context-path: /template
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
  api-docs: 
    path: /v3/api-docs
  openapi:
    info:
      title: Template API
      version: ${VERSION_NAME:unknown}

client:
  url: ${CLIENT_URL}
  proxy-secret: ${PROXY_SECRET:}

