packages:
  - 'apps/*'
  - 'packages/features/*'
  - 'packages/shared/*'
nodeLinker: hoisted
allowBuilds:
  '@openapitools/openapi-generator-cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@aimarchirico/*'

overrides:
  jiti: ^2.7.0
  tmp: ^0.2.6
  uuid: ^11.1.1
