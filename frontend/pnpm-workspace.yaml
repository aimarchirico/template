packages:
  - 'apps/*'
  - 'packages/features/*'
  - 'packages/shared/*'
nodeLinker: hoisted
allowBuilds:
  '@openapitools/openapi-generator-cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@aimarchirico/*'

overrides:
  jiti: ^2.7.0
  jsonpointer: ^5.0.1
  postcss: ^8.5.10
  tmp: ^0.2.6
  uuid: ^11.1.1
  httpsnippet>form-data: ^3.0.4
  oas-validator>ajv: ^8.18.0
  widdershins>markdown-it: ^12.3.2
