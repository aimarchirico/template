version: '3'

tasks:
  install:
    internal: true
    desc: Install npm dependencies
    cmds:
      - pnpm install
      - task: api
    if: '[ -n "$CI" ]'

  check:
    desc: Run lint and type checks
    cmds:
      - task: install
      - pnpm turbo run check

  fix:
    desc: Fix lint problems
    cmds:
      - pnpm turbo run fix

  run:
    desc: Start dev server
    cmds:
      - pnpm --filter @template/expo dev

  build:
    desc: Build development apk
    cmds:
      - pnpm --filter=@template/expo build

  api:
    desc: Generate OpenAPI client code and docs
    env:
      API_DOCS_OUTPUT_DIR: '{{.TASKFILE_DIR}}/../docs'
    cmds:
      - pnpm --filter @template/api-client api

  build:android:
    desc: Build release for android
    cmds:
      - task: install
      - pnpm --filter @template/expo prebuild
      - pnpm --filter @template/expo build

  build:web:
    desc: Build release for web
    cmds:
      - task: install
      - pnpm --filter @template/expo export
      - pnpm --filter @template/expo cloudflare:fix
