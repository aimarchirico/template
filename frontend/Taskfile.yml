version: '3'

tasks:
  install:
    internal: true
    desc: Install npm dependencies
    cmds:
      - pnpm install
      - task: api
    if: '[ -n "$CI" ]'

  check:
    desc: Run lint and type checks
    cmds:
      - task: install
      - pnpm turbo run check

  fix:
    desc: Fix lint problems
    cmds:
      - pnpm turbo run fix

  run:
    desc: Start dev server
    cmds:
      - pnpm --filter expo dev

  build:
    desc: Build development apk
    cmds:
      - pnpm --filter=expo build:debug

  api:
    desc: Generate OpenAPI client code and docs
    env:
      API_CLIENT_OUTPUT_DIR: '{{.TASKFILE_DIR}}/apps/expo/src/generated'
      API_DOCS_OUTPUT_DIR: '{{.TASKFILE_DIR}}/../docs'
    cmds:
      - pnpm --filter api-client api

  build:android:
    desc: Build release for android
    cmds:
      - task: install
      - task: api
      - pnpm --filter expo prebuild
      - pnpm --filter expo build:release

  build:web:
    desc: Build release for web
    cmds:
      - task: install
      - pnpm --filter expo export
      - pnpm --filter expo cloudflare:fix
