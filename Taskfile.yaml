version: '3'

# Included Taskfiles cannot declare their own dotenv, so setup/.env is loaded
# here. It stays inside setup/, which gitignores it.
dotenv: ['.env', 'setup/.env']

includes:
  tools:
    taskfile: ./tools/Taskfile.yaml
    dir: ./tools
    flatten: true
  github:
    taskfile: ./.github/Taskfile.yaml
    dir: ./.github
  backend:
    taskfile: ./backend/Taskfile.yaml
    dir: ./backend
  frontend:
    taskfile: ./frontend/Taskfile.yaml
    dir: ./frontend
  setup:
    taskfile: ./setup/Taskfile.yaml
    dir: ./setup

tasks:
  default:
    cmds:
      - task --list
