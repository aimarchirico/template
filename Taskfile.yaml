version: '3'

dotenv: ['.env']

includes:
  github:
    taskfile: ./.github/Taskfile.yaml
    dir: ./.github
  backend:
    taskfile: ./backend/Taskfile.yaml
    dir: ./backend
  frontend:
    taskfile: ./frontend/Taskfile.yaml
    dir: ./frontend
  tools:
    taskfile: ./tools/Taskfile.yaml
    dir: ./tools
    flatten: true

tasks:
  default:
    cmds:
      - task --list
