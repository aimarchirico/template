version: '3'

dotenv: ['.env']

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  tools:
    taskfile: ./tools/Taskfile.yml
    dir: ./tools
    flatten: true

tasks:
  default:
    cmds:
      - task --list
