version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  core:
    # Remote Taskfile registry (requires TASK_X_REMOTE_TASKFILES=1 and auth token for private repo):
    # taskfile: https://raw.githubusercontent.com/aimarchirico/core/dev/Taskfile.yml
    # Sibling relative path for local development (functional):
    taskfile: ../core/Taskfile.yml
    dir: ../core

tasks:
  check:
    desc: Trigger backend, frontend and core check
    preconditions:
      - sh: "pnpm --version"
        msg: "Missing dependency: pnpm is required for frontend tasks"
    cmds:
      - task: core:check
      - task: backend:check
      - task: frontend:check

  run:
    desc: Trigger backend and frontend run
    preconditions:
      - sh: "pnpm --version"
        msg: "Missing dependency: pnpm is required for frontend tasks"
    cmds:
      - task: backend:run
      - task: frontend:run

  fix:
    desc: Trigger formatting/linting orchestration for backend, frontend, and core
    preconditions:
      - sh: "pnpm --version"
        msg: "Missing dependency: pnpm is required for frontend tasks"
    cmds:
      - task: core:fix
      - task: backend:fix
      - task: frontend:fix

  api:
    desc: Delegate to core:openapi:run with project output targets
    preconditions:
      - sh: "node --version"
        msg: "Missing dependency: Node.js is required for API generation"
    cmds:
      - task: core:frontend:core-openapi:openapi:run
        env:
          API_CLIENT_OUTPUT_DIR: '{{.ROOT_DIR}}/frontend/packages/api-client/src/generated'
          API_DOCS_OUTPUT_DIR: '{{.ROOT_DIR}}/docs'

  "docker:up":
    desc: Start local container state
    preconditions:
      - sh: "docker --version"
        msg: "Missing dependency: Docker is required to manage containers"
    cmds:
      - task: backend:up

  "docker:down":
    desc: Stop local container state
    preconditions:
      - sh: "docker --version"
        msg: "Missing dependency: Docker is required to manage containers"
    cmds:
      - task: backend:down

  "ci:android":
    desc: Trigger targeted Android build pipeline
    preconditions:
      - sh: "pnpm --version"
        msg: "Missing dependency: pnpm is required for Android build"
    cmds:
      - task: frontend:ci:android

  "ci:web":
    desc: Trigger targeted Web build pipeline
    preconditions:
      - sh: "pnpm --version"
        msg: "Missing dependency: pnpm is required for Web build"
    cmds:
      - task: frontend:ci:web

  "sync:skills":
    desc: Orchestrate automated skill loading sequence for the core agent skills
    preconditions:
      - sh: "npx --version"
        msg: "Missing dependency: npx/node is required to sync skills"
      - sh: "python3 -c \"import os; exit(0 if os.path.isdir('../core/skills') else 1)\""
        msg: "Missing dependency: Core repository is not cloned at sibling path ../core"
    cmds:
      - npx skills add ../core/skills/commit
      - npx skills add ../core/skills/docs
      - npx skills add ../core/skills/implement
      - npx skills add ../core/skills/issues
      - npx skills add ../core/skills/pr
