version: '3'

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api
  client:
    taskfile: ./client/Taskfile.yml
    dir: ./client
  tools:
    taskfile: ./tools/Taskfile.yml
    dir: ./tools

tasks:
  check:
    desc: Run check across api, client, and tools
    cmds:
      - task: api:check
      - task: client:check
      - task: tools:check

  run:
    desc: Run api and client servers
    cmds:
      - task: api:run
      - task: client:run

  fix:
    desc: Fix formatting/linting across api, client, and tools
    cmds:
      - task: api:fix
      - task: client:fix
      - task: tools:fix

  api:
    desc: Generate API client
    cmds:
      - task: tools:api

  up:
    desc: Start local containers
    cmds:
      - task: api:up

  "docker:down":
    desc: Stop local containers
    cmds:
      - task: api:down

  "ci:android":
    desc: Run CI Android build
    cmds:
      - task: client:ci:android

  "ci:web":
    desc: Run CI Web build
    cmds:
      - task: client:ci:web
